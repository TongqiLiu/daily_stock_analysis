# Fear/Greed Sentiment Skill / 贪恐情绪极值
# 基于 szdt.tech 个股贪恐指数（约 -100~100）做逆向情绪分析。
# Trigger: 前端「😱 贪恐情绪」按钮，或在 prompt 中提及"贪恐"/"情绪极值"。

name: fear_greed_sentiment
display_name: 😱 贪恐情绪
description: 基于 szdt.tech 个股贪恐指数（-100~100）的逆向情绪分析。极度贪婪警示高位回撤，极度恐慌提示反向布局窗口。需 SZDT_AUTH_TOKEN，未配置时静默跳过。
category: sentiment
core_rules: [1, 4, 5]
required_tools:
  - get_realtime_quote
  - get_fear_greed_index
  - analyze_trend
aliases: [贪恐, 贪恐指数, 情绪极值, 反向情绪]
default_priority: 30
user_invocable: true
default_active: false
default_router: false
market_regimes: []

instructions: |
  **贪恐情绪极值分析（Fear/Greed Sentiment）**

  你的任务是基于 szdt.tech 个股贪恐指数（约 -100~100）做**逆向情绪分析**，配合行情判断当前是否处于市场情绪极值。

  ---

  ## 一、必调工具

  1. `get_realtime_quote` — 当前价格、涨跌幅、量比
  2. `get_fear_greed_index` — szdt.tech 贪恐分 + 中文标签
  3. `analyze_trend` — 趋势状态（用于交叉验证）

  ---

  ## 二、贪恐分映射

  | 贪恐分 | 标签 | 情绪状态 | 操作建议 |
  |---|---|---|---|
  | > +60 | 极度贪婪 | 🔴 高位风险 | 警惕回撤，已持仓考虑分批减仓 |
  | +20 ~ +60 | 贪婪 | 🟡 偏多情绪 | 关注短期获利回吐 |
  | -20 ~ +20 | 中性 | ⚪ 无极值信号 | 情绪不构成单独依据，按趋势操作 |
  | -60 ~ -20 | 恐慌 | 🟡 偏空情绪 | 关注情绪修复，关注超跌反弹 |
  | < -60 | 极度恐慌 | 🟢 反向布局窗口 | 关注左侧布局机会（需配合基本面） |

  ## 三、必须包含的交叉判断

  贪恐指数**不能单独使用**，必须与以下至少一项交叉验证：

  - **趋势状态**：贪恐"极度贪婪" + MA5>MA10>MA20 趋势完好 → 警告"趋势仍可持有但加仓需谨慎"；趋势已破位 → 强烈卖出
  - **量价**：贪恐"极度恐慌" + 缩量企稳 → 加权确认；放量下挫 → 仍未到位
  - **历史时序**：如果工具返回了近期分值变化（暂未实现，先用趋势近 5 日表现替代），观察情绪是否在修复

  ## 四、工具失败处理

  - 工具返回 `status='not_configured'` → 在报告中标注「贪恐指数未启用（SZDT_AUTH_TOKEN 未配置）」，仅基于趋势 / 量价分析
  - 工具返回 `status='unavailable'` → 标注「该股票未在 szdt.tech 账户中绑定，需手动绑定后才能查询」，不阻塞回答
  - 工具返回 `status='error'` → 标注「贪恐指数获取失败」，继续基于其他工具分析

  ## 五、输出结构（精简）

  ### 1. 数据快照
  - 当前价格、涨跌幅
  - **贪恐分 + 标签 + 更新时间**（粗体）
  - 关键技术指标（MA5/10/20、MACD）

  ### 2. 情绪判读
  - 当前所处区间（极度贪婪/贪婪/中性/恐慌/极度恐慌）
  - 与趋势/量价的一致性 / 背离情况

  ### 3. 操作建议（≤ 5 条）
  - **入场/出场区间**（如适用）
  - **仓位建议**
  - **风险提示**（1-2 条具体风险）

  ### 4. 评分调整（必填）
  - 极度贪婪 (>60)：`sentiment_score -10 ~ -15`
  - 贪婪 (20~60)：`sentiment_score -3 ~ -8`
  - 中性 (-20~20)：`sentiment_score 0`
  - 恐慌 (-60~-20)：`sentiment_score +3 ~ +8`
  - 极度恐慌 (<-60)：`sentiment_score +10 ~ +15`

  ## 六、约束

  1. **必须调用 `get_fear_greed_index`**，缺失时明确说明原因，不可臆造贪恐分
  2. **贪恐指数是逆向指标**，不作为单一买卖信号
  3. **保持客观**：贪恐分极值时大胆给出反向建议，不要刻意迎合用户情绪
  4. 中文输出，数字保留 1 位小数
