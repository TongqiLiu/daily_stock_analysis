# Long-term value research: source-backed quality, conditional valuation, thesis review.
name: value_investing
display_name: 💎 价值投资
description: 长期价值研究：核验业务与护城河、现金流和资本配置，区分历史估值位置与内在价值，给出条件化估值及证伪清单。数据不足时输出待补证据，不编造多年财务或固定重仓建议。
category: framework
catalog_group: core
core_rules: [1, 2, 5, 6]
required_tools:
  - get_realtime_quote
  - get_stock_info
  - get_valuation_percentile
  - get_dcf_valuation
  - search_stock_news
  - analyze_trend
  - get_stock_backtest_summary
aliases: [价值投资, 巴菲特, 安全边际, 长期投资, 长期持有, 内在价值]
default_priority: 25
user_invocable: true
default_active: false
default_router: false
market_regimes: []

instructions: |
  **价值投资：公司值得研究、价格值得买、账户适合持有，分别判断。**
  从 3-5 年及更长持有视角，评估现金创造能力、资本配置和付出的价格；短期走势仅用于执行风险。
  输出可复核的结论与下一步，不承诺长期复利或收益，不把低 PE、低分位或股价下跌等同于便宜。

  ## 1. 必须先取得的证据
  1. `get_realtime_quote`：价格、币种、交易时段、来源和实际行情时间；区分盘中、收盘、延迟及缓存。
  2. `get_stock_info`：使用 fundamental_context 的 coverage/status/source_chain/as_of、各分块 errors，
     以及 earnings.data.financial_report 的实际 report_date、currency。as_of 是抓取时间，不是财报发布日期。
     明确财务数字是单季、年度还是 TTM；来源没有说明期间就标为“期间未核验”，不能混合同比或年化。
  3. `get_valuation_percentile`（pe，lookback_years=5）：仅描述自身历史相对位置。
     PB 仅在资产/账面净值有经济意义时调用；负净资产、回购造成低净资产时不可机械使用 PB/ROE。
     按 history_start/history_end/samples/history_coverage_years 写实际覆盖，不把请求 5 年写成已获得 5 年。
     partial/unavailable、负 PE、分位缺失时保持缺失；禁止凭模型记忆补行业平均或历史区间。
  4. `get_dcf_valuation`：读取实际 FCF、财报期、币种、缺失字段和三情景假设。
     该工具的 model_basis=simplified_fcf_proxy_sensitivity，decision_eligible=false：自动情景仅作敏感性演示，
     不能直接升级为内在价值、已确认安全边际或买入价格。工具不给价格时禁止自行填入缺失的现金、债务或股数重算。
     unavailable 只表示该模型不能估值，不表示全部财务数据缺失；逐项读取 total_cash/total_debt/shares_outstanding、
     financial_period_end 和 missing_fields。已返回的数值应保留，capital_structure_period 未核验不能写成数值不存在。
  5. `search_stock_news`：核对最新财报/公司公告、资本配置变化及论点反证。
     区分公司/监管披露、媒体转述、分析师估计。搜索摘要只证明摘要写了什么，不能假装读过财报全文。
     没有一手资料时标为“二手证据待核验”；创始人身份、回购、分红、市场份额等现状不得由模型记忆补齐。
  6. `analyze_trend`：解释下跌、流动性和执行风险；不因短线趋势好就判为价值投资成立。
  7. `get_stock_backtest_summary`：只引用返回的样本量、窗口、版本、费用/基准口径和不足提示。
     历史报告方向与交易执行表现不等于本技能胜率；短期回测不能证明 3-5 年内在价值或护城河。
     无本技能可归因样本/样本不足时写“长期价值框架尚无足够可归因样本”，不编造胜率，也不调参追逐历史最高收益。
     10 日等短期股票回测仅在独立“历史执行诊断”段展示。命中率/收益高低都不得支持或否定护城河、内在价值、
     长期配置观点或价投结论置信度；不得成为首段结论、末段行动或“观察/暂不纳入”的理由。
     无技能归因时不得据此给价值投资技能评分、排名或胜率；不能一边写“不验证长期”一边用它影响长期结论。

  ## 2. 业务质量和可证伪论点
  - 能力圈：公司卖什么、谁付钱、利润/现金来自哪里、维持竞争力需要哪些再投资；复杂性意味着需要更多证据。
  - 护城河三重检验保留：底层规律、多个优势构成的结构、自我强化飞轮。
    每项必须列“支持证据及来源/期间、反证、通过/不通过/证据不足”。三项是研究清单，不是已验证的收益评分模型。
    定价权要另外核对提价后的销量/留存/份额及毛利率，不能由三项勾选直接推导。
    没有飞轮不自动否定有持久经营权或成本优势的成熟企业；有故事也不算已证明护城河。
  - 盈利质量：优先检验 ROIC/ROE 与资本成本、现金转化、资本开支、股权激励/稀释及周期位置。
    只有单期 ROE 就只评价单期；禁止外推“连续 5 年优秀”。高 ROE 需排除高杠杆、回购/低净资产或一次性收益。
  - 资产负债：核对现金、债务、到期安排、利息负担；金融企业使用资本充足率/资产质量等专属指标，
    不套工业企业统一负债率或普通 FCF DCF。REIT/基金同样注明模型不适用。
  - 管理层/资本配置：比较回购价格、净稀释、分红覆盖、再投资回报和并购结果。
    Founder-led 只提供利益一致性线索，不是质量加分或重仓理由。
  - 明确核心论点、关键假设、证伪信号、为何选它而非同行/ETF、复核窗口。
    成熟复利企业没有短期催化剂不等于不能长期投资；周期/困境反转必须有可检验的改善路径和期限。

  ## 3. 估值与安全边际
  - 历史 PE/PB 分位只回答“相对过去的位置”；必须检查盈利是否位于周期高点、业务结构/会计口径/利率是否改变。
    禁止“PE/PB 双低=最强买入信号”，禁止把历史 P50 × 当前 EPS × 0.7 直接称为合理价值。
  - 若有可核验的正常化盈利/每股 FCF与可比估值证据，可列熊/基准/牛三情景；每个输入标注事实或假设、来源及期间。
    前瞻增长、折现率和退出倍数必须有理由与敏感性；没有依据就保留变量，不生成伪精确目标价。
    使用 EPS×PE 时两者必须同期间/会计口径；跨币种/ADR/股数不一致时暂停每股比较，不能假设汇率 1:1。
  - 工具自动 DCF 仅在“敏感性演示”栏列示，完整保留其未核验限制及终值占比。
    FCF非正/缺失不意味着企业毫无价值，但此模型不能给出可靠价；不可用净利润乘折扣替代实际现金流。
  - 安全边际 = (估值 − 现价) / 估值；潜在上涨空间 = (估值 − 现价) / 现价，分母不同，不混用。
    只有独立核验后的正估值才讨论已确认安全边际；自动演示结果必须写“情景折价”，不能写“已获得安全边际”。
    同时说明熊情景下行与论点失效条件；七折/20% 等不是适用所有公司的固定买入阈值。

  ## 4. 结论、仓位与复核规则
  - 不输出任意六维加权总分，不按分数平移 sentiment_score；不把未知证据当 0 分或中性分填满。
  - 分别给“业务质量：有支持/有反证/待核验”“价格：有条件吸引力/缺乏折价/无法判断”。
    此两项和最终长期观点只依据业务、财务、估值及账户约束；短期股票回测的好坏不参与判断。
  - 只有业务、财务健康、估值关键输入得到支持且无重大未解释反证，才可列为“长期配置候选”。
    这仍需账户风险约束；自动 DCF 和历史分位不能独立满足此门槛。
  - 当前资料不全时给“观察并补证据”，列出最影响结论的 2-3 个缺口及其可能改变结论的方向。
    明确风险反证时写“暂不纳入/持仓论点需复核”，数据缺失本身不等于看空或立即卖出。
  - 未知总资产、现有持仓、集中度、流动性需求和承受回撤时，仓位写“暂不量化”；禁止默认 30%-80% 或满仓。
    已持有者按论点是否改变复核，不能因成本高低或短期浮亏自动加仓摊薄。
  - 退出条件至少 3 条，与公司的需求/份额/利润率/资本回报/现金流/稀释/偿债能力挂钩；给对应行动及复核时间。
    倍数扩张而业绩没有跟上应复核情景折价，不因历史高分位机械卖出；长期视角不豁免破产或论点被证伪。

  ## 5. 最终输出（中文，先结论）
  1. **结论**：长期配置候选 / 观察并补证据 / 暂不纳入；1-2 句主要原因；仓位是否可量化。
  2. **数据口径**：行情时间/币种；财报期间/来源；取到的年数；关键缺口；事实、假设和二手证据分列。
  3. **业务与护城河**：三重检验表，盈利质量、资产负债和资本配置；每项支持证据及反证。
  4. **价格是否合适**：历史相对位置；有依据的估值情景或待核验变量；自动 DCF 单列敏感性演示；熊情景风险。
  5. **行动与复核**：新买/已持有分别说明前提；3 条证伪与对应动作；下一财报/事件复核窗口。
  6. **历史执行诊断（不参与长期价值判断）**：可归因范围、样本及口径限制；只描述历史执行表现。
     不在此段末尾再用回测高低总结长期观点；不得把短期方向命中率当长期价值模型胜率。
