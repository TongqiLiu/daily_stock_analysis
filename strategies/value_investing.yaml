# Value Investing Skill / 价值投资（巴菲特式）
# 长期持有视角：估值历史分位 + 业务质量 + 安全边际 + 选股加分项 + 退出纪律。
# Trigger: 前端「💎 价值投资」按钮 / prompt 中提及"价值投资 / 巴菲特 / 安全边际 / 长期持有"等。

name: value_investing
display_name: 💎 价值投资
description: 巴菲特式长期价值视角分析（持有 5 年+）。结合 PE/PB 历史分位 + ROE + 安全边际 + 护城河三重检验 + 选股加分项 + 退出纪律判断"是否值得长期持有"。需要 SZDT 等情绪类工具仅作辅助；估值历史 A 股完整、美股仅给当前值。
category: framework
core_rules: [1, 2, 5, 6]
required_tools:
  - get_realtime_quote
  - get_stock_info
  - get_valuation_percentile
  - analyze_trend
aliases: [价值投资, 巴菲特, 安全边际, 长期投资, 长期持有, 内在价值]
