instructions: |
  **波浪理论（Elliott Wave Theory）**

  核心原则：市场按照 5 浪推进 + 3 浪调整的循环结构运行。

  ## 分析步骤

  ### 1. 识别当前浪型
  先调用 `get_realtime_quote` 获取本轮当前价，再使用 `get_daily_history` 获取近 120 日数据，并结合 `analyze_trend`、`calculate_ma`、`get_volume_analysis` 验证趋势和量能。浪型是可证伪的候选路径，不是唯一事实；所有点位必须来自本轮工具数据。

  **推动浪（1-3-5）识别特征**：
  - 第1浪：趋势反转的第一波，成交量温和放大。
  - 第3浪：最强劲的推动浪，通常放大量，MACD 强势；绝不是最短浪。
  - 第5浪：量能往往弱于第3浪，出现顶背离则走高后即将结束。

  **调整浪（A-B-C）识别特征**：
  - A 浪：第一次下跌，成交量较大，多数人以为是回调。
  - B 浪：反弹，力度弱于前期涨幅，成交量萎缩，陷阱风险高。
  - C 浪：第二次下跌，力度往往超过 A 浪，完成调整。

  ### 2. 黄金位置判断
  - 第2浪回调通常在第1浪的 38.2%~61.8%。
  - 第3浪目标通常是第1浪的 1.618~2.618 倍延伸。
  - 第4浪不得进入第1浪价格区域（违反波浪规则）。
  - C浪目标：A 浪顶端起算，等于或超过 A 浪长度。

  ### 3. 最优买点
  - **第2浪回调企稳**（黄金坑）：最安全买点，止损第1浪起点。
  - **第4浪回调企稳**：次优，止损第1浪顶部。
  - **第3浪初期突破**：放量突破第1浪高点时。
  - 避免在第5浪末端追高（顶背离风险）。
  - 突破第1浪高点只是第3浪候选的重要条件，不是充分条件。缩量突破、长期均线仍空头或缺少更高级别数据时，最多给中置信度。

  ### 4. 风险提示
  - B浪反弹不宜重仓（陷阱性质）。
  - 波浪计数存在主观性，需结合其他技术指标验证。
  - 若波浪规则被违反（如第4浪侵入第1浪），需重新归数。
  - 第3浪尚未走完时，不得宣称“第3浪不是最短”和“第1/4浪不重叠”已经验证，只能列为后续验证项。
  - 必须提供至少一个替代数浪（如 B 浪反弹、箱体假突破），不得使用“无争议确认”“教科书级确认”“彻底反转”等绝对措辞。

  ### 5. 输出要求
  - 给出当前可能的浪型位置（如："处于第3浪中段"或"疑似第4浪调整"）。
  - 给出关键斐波那契支撑/阻力位（0.382/0.618/1.618）。
  - 说明当前是买入时机、等待机会还是规避。
  - 标注波浪计数的置信度（高/中/低）。
  - 若判断为“第3浪候选启动/已启动/进行中”，必须增加 `浪型图与判定` 章节，用 Markdown `text` 代码块绘制非单行 ASCII 图，并标注 O（第1浪起点）、A（第1浪顶）、B（第2浪低点）、当前点的日期和价格。
  - 浪型图后必须给出：第2浪回撤比例、价格与量能的支持/未满足证据、至少一个替代数浪、确认位、弱化位、硬证伪位、1.0/1.618 情景目标公式和置信度。

  浪型图格式示例：

  ```text
  价格
                         ● 当前：YYYY-MM-DD / Px（第3浪候选）
                        /
       A：YYYY-MM-DD / P1 ●────┄┄ 确认线
                   \  /
                    ● B：YYYY-MM-DD / P2
                  /
  O：YYYY-MM-DD / P0 ●
  时间 ─────────────────────────▶
  ```

  评分调整建议：
  - 第2浪底部企稳（黄金坑）：`sentiment_score +15`
  - 第3浪突破确认：`sentiment_score +12`
  - 第5浪末端/顶背离：`sentiment_score -10`
  - C浪下跌中：`sentiment_score -12`
