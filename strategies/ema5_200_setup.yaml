# EMA200 Reclaim Candidate / EMA200 回踩候选

name: ema5_200_setup
display_name: ema5_200_setup
description: EMA200 回踩/触碰后短窗口 reclaim 候选判断；用于筛出"可以观察或小仓尝试"的基础 setup。
category: pattern
core_rules: [1, 2, 4]
required_tools:
  - analyze_ema200_setup
aliases: [EMA200候选, EMA200回踩, ema5_200_setup]
default_priority: 32
user_invocable: true
market_regimes: [trending_up, pullback]

instructions: |
  **ema5_200_setup（EMA200 reclaim candidate）**

  你的任务不是预测涨跌，而是判断当前个股是否符合 EMA200 回踩后 reclaim 的基础候选结构。

  ## 必须调用工具

  1. 必须调用 `analyze_ema200_setup`，参数：
     - `stock_code`: 用户提到的股票代码
     - `setup_id`: `ema5_200_setup`
     - `timeframe`: `5m`（5分钟图，对应 Pine Script 原始设计）
     - `days`: 300（至少300根5分钟K线）
  2. 工具会自动获取 4H EMA200 作为 HTF 趋势过滤器。
  3. 如果工具返回 `status='insufficient_data'`、`error` 或历史 K 线不足，必须直接写"信息不足"，不能强行判断。
  4. 如果工具返回 `status='htf_bearish'`，说明 4H 趋势为空头，必须直接写"HTF 空头，跳过"。

  ## 判断等级

  只允许输出以下等级：

  - `0 = 不适合进场`：没有近期 EMA200 触碰、触碰后跌破、或候选窗口超时、或 HTF 空头。
  - `1 = 只适合观察`：价格接近/触碰 EMA200，但还没有明确 reclaim。
  - `2 = 可以小仓尝试 / candidate`：近期触碰 EMA200 后，在测试窗口内重新站回 EMA200 buffer 上方，且 HTF 多头。

  本 skill 不允许给 `3 = 可以执行`，因为它不验证 higher low / 双底低点、结构止损与 1R 空间。

  ## 输出格式

  必须按以下格式输出，保持精简：

  ### EMA200 基础候选判断
  - 股票：
  - 数据周期：5m（5分钟图）
  - HTF 趋势：使用工具返回的 `htf_bias`（多头/空头）
  - HTF EMA200：使用工具返回的 `htf_ema200`
  - 当前价格 / 5m EMA200：
  - 价格与 EMA200：
  - 最近触碰：日期 + 距今 bar 数；没有则写"无"
  - 当前等级：0 / 1 / 2
  - 结论：不适合 / 仅观察 / candidate

  ### 证据
  - 列出工具 `reasons` 中的关键证据

  ### 缺失信息 / 风险
  - 列出工具 `missing`
  - 明确写：本 skill 只给基础候选，不确认正式入场结构

  ### 失效条件
  - 使用工具 `risk_plan.failure_condition`（如有）
