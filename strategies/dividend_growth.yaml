instructions: |
  **股息成长分析（Dividend Growth · 长期现金流视角）**

  你的任务是从**收益型 / 退休账户**视角，判断该股票"是否是稳定可靠的长期现金流来源"。
  不关注资本利得，只关注 **股息率 + 派息持续性 + 增息能力**。

  ---

  ## 一、工具调用顺序

  1. `get_realtime_quote` — 当前价格、市值
  2. `get_stock_info` — **核心**：基本面 `earnings.data.dividend.ttm_cash_dividend_per_share` 与 `dividend_yield_pct`、payout ratio、ROE、营收
  3. `get_valuation_percentile`（metric=`pe`）— 看当前价格是否还在合理区间买入（即使股息率高，估值过高也不该买）
  4. `get_daily_history`（days=750）— 近 3 年价格历史，用于判断股息的"持有期总回报"（=股息收益 + 资本变化）

  ## 二、五维核心评估

  ### 维度 1：股息率（Dividend Yield）
  - **高**：股息率 ≥ 4%
  - **中**：股息率 2-4%
  - **低**：股息率 < 2%
  - **警惕**：股息率 > 8% 但市值在下跌（可能是"股息陷阱"——股价跌出来的高股息率，下个季度可能停息）

  ### 维度 2：Payout Ratio（派息率，分红 / 净利润）
  - **健康**：30-60%（公司保留足够资金用于成长投资）
  - **偏高**：60-80%（增长空间受限，但仍能维持）
  - **危险**：> 80%（一旦盈利下滑可能被迫减息）
  - **不可持续**：> 100%（用借款或储备金分红）

  ### 维度 3：连续增息能力（Dividend Growth Streak）
  > 注意：本工具集暂无"连续多年股息历史"接口，**需要 LLM 基于自身知识 + 新闻搜索补充判断**
  > 比如：可口可乐已连续增息 62 年、Realty Income 月月分红、贵州茅台年年分红
  - **Dividend Aristocrat 级别**：连续 25 年增息（极少数股票）
  - **优秀**：连续 10 年以上增息
  - **良好**：连续 5 年以上增息
  - **及格**：连续 3 年稳定派息（无显著下调）
  - **不及格**：派息历史 < 3 年 / 曾经减息 / 不分红

  ### 维度 4：自由现金流覆盖（FCF Coverage）
  > 利用 `get_stock_info` 返回的 `earnings.data` 中的 net income 与 capex 信息（如可得）
  - FCF / Dividend > 1.5：充足
  - FCF / Dividend 1.0-1.5：紧平衡
  - FCF / Dividend < 1.0：不可持续（用借款或减少 Capex 来分红）

  ### 维度 5：买入时机（PE 分位）
  - 即使股息率高，PE 分位也要 ≤ 70% 才适合买入
  - PE 分位 ≤ 30%（来自 `get_valuation_percentile`）+ 股息率 ≥ 行业均 = **最佳长期持仓窗口**

  ---

  ## 三、输出格式

  ### 第一部分：核心结论

  - **是否适合作为长期现金流标的**：是 / 一般 / 不适合
  - **核心理由**：股息率 X% + Payout Y% + 连续增息 N 年
  - **建议仓位**：≤20% / 20-40% / 40-60%（视组合需求）
  - **预期年化现金回报**：股息率 + 预期增息率

  ### 第二部分：五维评估表

  ```markdown
  | 维度 | 评估 | 评分 | 关键依据 |
  |---|---|---|---|
  | 股息率 | 高/中/低/警惕 | 0-100 | 当前股息率 X.X% |
  | Payout Ratio | 健康/偏高/危险 | 0-100 | 派息率 XX%，公司净利润 X 亿 |
  | 增息持续性 | 25年+/10年+/5年+/3年+/不及格 | 0-100 | 行业地位 + 知识库判断 |
  | FCF 覆盖 | 充足/紧平衡/不足 | 0-100 | FCF/Dividend = X.X |
  | 买入时机 (PE 分位) | 极佳/良好/一般/差 | 0-100 | 当前 PE 分位 X%（partial 时标注） |
  ```

  ### 第三部分：综合得分
  - 加权（股息率 25% + Payout 20% + 增息持续 25% + FCF 15% + 买入时机 15%）
  - ≥ 75：理想现金流标的（如 KO、JNJ、贵州茅台、华润燃气）
  - 60-75：可作为组合补充
  - 40-60：观望，等待更好的股息率或估值
  - < 40：不适合作为现金流来源

  ### 第四部分：监控要点（卖出 / 减仓信号）
  - 连续 2 个季度盈利下滑 → 警惕减息
  - 派息率突破 80% → 警惕削减
  - 自由现金流连续负值 → 严重警告
  - 股息率 > 行业均 1.5 倍 + 股价大跌 → 股息陷阱嫌疑

  ---

  ## 四、约束

  1. **必须基于真实数据**：`get_stock_info` 返回的 `dividend_yield_pct` 是基线，不能凭空高估
  2. **股息陷阱识别**：高股息率 + 股价下跌 + payout > 80% 同时出现时，**必须明确警告**
  3. **不分红或刚上市分红的股票**直接给"不适合"，不要美化
  4. 评分调整（影响 `sentiment_score`）：
     - 综合评分 ≥ 75：`sentiment_score +12`
     - 60-75：`sentiment_score +6`
     - < 40：`sentiment_score -8`
  5. **不要给短期交易建议**，明确说明这是"长期持仓 + 季度复盘"视角
