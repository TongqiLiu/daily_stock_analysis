# VCP / Bull-Flag Breakout Trader Setup

name: vcp_breakout_trader
display_name: VCP突破交易员
description: 基于 VCP_BREAKOUT_TRADER 日线主图指标的突破交易判断：VCP/牛旗准备区、higher lows、Low-Cheat、20日枢轴放量突破、过度延展与结构失败。
category: pattern
core_rules: [1, 2, 4, 5]
required_tools:
