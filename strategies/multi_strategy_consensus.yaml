# Multi-Strategy Consensus Skill / 多策略联合分析
# Meta-skill that orchestrates 13 built-in strategies into a single weighted-score
# table output. Designed for the chat page "⚡ 多策略联合" button.

name: multi_strategy_consensus
display_name: ⚡ 多策略联合
description: 从趋势、量价、结构、情绪、相对强弱五维组织 13 项策略证据，包含正式的价格行为学评分，保留逐项评分并输出方向、证据质量、分持仓动作与风险门控。
category: framework
core_rules: [1, 2, 3, 4, 5]
required_tools:
  - get_daily_history
  - get_weekly_history
  - analyze_trend
  - get_realtime_quote
  - calculate_ma
  - get_volume_analysis
  - get_fear_greed_index
  - analyze_pattern
  - analyze_price_action
  - analyze_relative_strength
  - calculate_multi_strategy_score
aliases: [多策略, 联合分析, 综合分析, 多策略联合]
default_priority: 5
user_invocable: true
default_active: false
default_router: false
market_regimes: []

instructions: |
  **多策略联合分析（Multi-Strategy Consensus）**

  你的任务是调用以下 13 个内置策略框架逐项评估，并把完整候选行提交给确定性评分工具。13 项明细必须保留，但它们按趋势、量价、结构、情绪、相对强弱五维组织，不能被解释成 13 份彼此独立的证据。用户可见的结论摘要、五维汇总、13 行表格与综合评分由后端直接根据工具结果生成；你的最终正文只负责补充行情解释和带价格条件的交易计划，不要手工复写评分区块。

  ---

  ## 一、工具调用顺序（必须执行）

  按顺序调用，结果保留在上下文用于后续打分：

  1. `get_realtime_quote` — 当前价格、涨跌幅
  2. `get_daily_history` — 近 120 日 K 线
  3. `get_weekly_history` — 优先使用 Futu OpenD 原生周线；若回退到日线聚合，必须读取 `source`、`data_quality`、`is_partial` 和 `fallback_reason`
  4. `analyze_trend` — MA5/MA10/MA20、MACD、RSI、KDJ、布林带
  5. `calculate_ma` — 均线扩展（含 MA60/MA120/MA250 和乖离）
  6. `get_volume_analysis` — 量比、放量/缩量、近 30 日量价
  7. `get_fear_greed_index` — szdt.tech 贪恐分（-100~100），用于第 12 项情绪打分
  8. `analyze_pattern` — 形态识别；第 11 项只有工具或最近 4 根 OHLC 明确支持时才允许给方向分
  9. `analyze_price_action` — 传 `days=120, intraday_timeframe=15m`，识别趋势/交易区间、HH/HL/LH/LL、突破/失败突破、重要低点、ATR14 缓冲止损、强阳 K 跟踪位与真实日内 VWAP；VWAP 不可用时必须读取 `data_gaps` 并降级，禁止用日线均价冒充
  10. `analyze_relative_strength` — 传 `stock_code` 和 `days=120`，默认按市场使用 SPY / HK02800 / 510300，与个股共同交易日对齐计算 5/20/60 日相对收益；只有用户或本轮可信工具给出了行业 ETF/指数代码时才传 `sector_benchmark_code`，禁止模型猜行业基准
  11. 将价格行为学与相对强弱结果分别映射到第 13 项和第 9 项，再调用 `calculate_multi_strategy_score` — 必须根据名称/代码显式传 `instrument_type=standard|leveraged_etf`，并把 `analyze_trend` 返回的 `current_price`、`support_levels`、`resistance_levels`、可用的 `breakout_status` / `invalidation_level` 组成 `market_structure_json` 一并传入；由程序校验评分区间、证据覆盖率、有效权重、五维综合得分、维度冲突、价格结构和仓位；工具返回 invalid 时必须修正 13 项或结构化价格字段并重新调用，禁止绕过

  ### 价格行为学结果如何融合到 13 项候选
  - `bull_trend`：使用 `context` 与 HH/HL、LH/LL 作为趋势结构的辅助证据；结构不一致时最多 `partial`，不得仅凭收盘站上 MA20 给强信号。
  - `volume_breakout`：使用 `signal.type`、收盘位置和 `get_volume_analysis` 的量能共同判断；只有价格行为突破但没有量能时，写“突破候选/量能待确认”，不得写“放量突破”。
  - `box_oscillation`：使用 `context.state=trading_range` 及前 20 日高低点作为区间证据；接近区间边界时，结合支撑/阻力决定观察、低吸或等待突破。
  - `shrink_pullback`：使用 signal bar 和二次入场字段辅助判断回踩后的信号 K；`second_entry.status=not_determined` 时，不得声称二次入场已确认。
  - `chan_theory`、`wave_theory`：只能把摆动结构作为辅助，不得用 HH/HL 或一次突破单独完成缠论笔段、中枢或波浪确认。
  - `price_action`：作为独立第 13 行提交；日线结构、重要低点和 ATR 可用但日内 VWAP 缺失时最多 `partial + 中`，不得给强信号。
  - 其余策略不得强行套用价格行为学结论；没有直接证据时仍按 `partial` 或 `missing` 处理。
  - 每个受影响策略的 `reason` 必须写清“价格行为学支持什么、缺什么、是否需要后续确认”，最终严格提交 13 行。

  补充工具按需调用：`get_chip_distribution`（筹码）、`get_capital_flow`（主力资金）。

  ### 证据分级（每项必填）

  - `complete`：该策略的必要条件均有本轮工具数据支持。
  - `partial`：只有部分必要条件；可以评分，但最高只能给「中」，并在依据中写清缺口。
  - `missing`：关键输入缺失；该行仍保留，但必须写「不可评估 / - / —」，交由评分工具从分母排除，禁止用 50 分伪装成中性证据。
  - 最终结论必须同时报告：完整/部分/缺失项数、有效权重覆盖率、证据质量覆盖率和五维覆盖数。
  - 证据质量按 `complete=1.0`、`partial=0.5`、`missing=0` 折算。有效权重覆盖率低于 70%、质量覆盖率低于 65%、可评估项少于 8 项或五维少于 4 维时，只能输出「证据不足（观望）」。禁止把全部 `partial` 解释为 100% 高质量覆盖。

  ---

  ## 二、13 个子策略评估口诀（精简规则）

  ### 1. 多头趋势（bull_trend，权重 1.0）
  - **强**：MA5 > MA10 > MA20 排列 + MA20 斜率向上 + 乖离率 < 5%
  - **中**：MA5 > MA10，MA20 走平
  - **弱**：均线粘合 / 价格跌破 MA20

  ### 2. 缠论（chan_theory，权重 1.0）
  - **强**：底背驰 + MACD 绿柱缩小（一买）
  - **中**：二买/三买信号、中枢突破
  - **弱**：中枢震荡无方向、顶背驰
  - 只有 MACD 而没有可定位的中枢/笔/背驰比较段时，证据只能标 `partial`，不得写「底背驰完整」「一买确认」

  ### 3. 均线金叉（ma_golden_cross，权重 0.9）
  - **强**：MA5 上穿 MA10 + 量能放大；DIF 上穿 DEA（MACD 金叉）
  - **中**：MA5 上穿 MA10 但量能温和
  - **弱**：均线纠缠、死叉风险

  ### 4. 缩量回踩（shrink_pullback，权重 0.9）
  - **强**：回踩 MA5/MA10 不破 + 成交量萎缩 30% 以上
  - **中**：回踩 MA20 企稳
  - **弱**：跌破 MA20、放量下杀

  ### 5. 放量突破（volume_breakout，权重 0.8）
  - **强**：突破 20 日新高 + 量比 ≥ 1.5
  - **中**：突破短期阻力位 + 量能温和放大
  - **弱**：缩量假突破、量价背离
  - 量比 < 1.0 时禁止使用「放量突破」「放量反包」；即使价格创新高，也只能描述为缩量突破候选

  ### 6. 波浪理论（wave_theory，权重 0.8）
  - **强**：第 2 浪回调（黄金坑）/ 第 3 浪初期突破
  - **中**：第 4 浪调整结束
  - **弱**：第 5 浪末端、C 浪进行中
  - 浪型是候选解释，不是唯一事实。必须列出关键摆动点的日期/价格，不得只凭 MACD 或一次突破完成数浪
  - 突破第 1 浪高点只是「第 3 浪候选启动」的重要条件，不是充分条件；量能不足、长周期仍为空头或存在 B 浪替代解释时，最多给 `partial + 中`
  - 第 3 浪尚未走完时，不得宣称「三条铁律全部满足」；第 3 浪非最短、第 1/4 浪不重叠只能列为后续验证项
  - 禁止使用「无争议确认」「教科书级确认」「彻底反转」等绝对措辞，统一使用「候选」「概率判断」「待确认」
  - 若判断为「第 3 浪候选启动/已启动」，最终报告必须输出本文件后述的「浪型图与判定」章节

  ### 7. 底部放量（bottom_volume，权重 0.7）
  - **强**：周线底部 + 日线放量 + 长下影
  - **中**：周线底部企稳，量能温和
  - **弱**：地量未现、阴跌不止
  - `get_weekly_history` 的 `data_quality=complete` 且有足够周线样本时，才可使用完整周线证据；`is_partial=true` 或来源为日线聚合时最多为 `partial`，不得给「强」

  ### 8. 箱体震荡（box_oscillation，权重 0.7）
  - **强**：箱体下沿企稳（低吸点）
  - **中**：箱体中部震荡
  - **弱**：箱体上沿（高位）/ 跌破箱体

  ### 9. 龙头策略（dragon_head，权重 0.7）
  - **强**：`analyze_relative_strength` 同时证明 20/60 日跑赢大盘和可信行业基准，且个股创新高
  - **中**：5/20/60 日多数跑赢大盘，但行业基准缺失或尚未创新高
  - **弱**：多数窗口跑输大盘，或同时跑输大盘与可信行业基准
  - 必须引用工具的 `as_of`、基准代码及 5/20/60 日超额收益。只有大盘基准而没有行业基准时最多 `partial + 中`，不得确认“行业龙头”
  - 工具不可用时必须标 `missing` 并排除计分；不得凭公司名称、ETF 名称或历史印象声称板块走强/走弱

  ### 10. 情绪周期（emotion_cycle，权重 0.6）
  - **强**：市场恐慌期 + 个股逆势抗跌（恐慌买入）
  - **中**：市场中性，情绪平稳
  - **弱**：市场极度贪婪期（高位风险）
  - 必须同时有市场情绪和 `analyze_relative_strength` 个股相对基准证据；只有个股贪恐分或只有相对强弱时标 `partial`，不得与第 9/12 项用同一句依据重复强化方向

  ### 11. 一阳夹三阴（one_yang_three_yin，权重 0.6）
  - **强**：标准形态 + 放量阳包阴
  - **中**：形态完整但量能一般
  - **弱**：形态破坏 / 阴线吞噬阳线
  - 「阳包一阴」不等于「一阳夹三阴」。只有 `analyze_pattern` 或最近 4 根 OHLC 能明确证明标准结构时才允许给方向分
  - 未触发标准形态时按**观望/中/50 分**计入；形态数据不可用时标 `missing`

  ### 12. 贪恐情绪极值（fear_greed_sentiment，权重 0.5，逆向）
  - 数据来源：`get_fear_greed_index` 工具（szdt.tech，约 -100~100）
  - **强（买入）**：贪恐分 < -60（极度恐慌）→ 反向布局窗口
  - **中（买入）**：贪恐分 -60~-20（恐慌）→ 关注情绪修复
  - **中（观望）**：贪恐分 -20~+20（中性）→ 情绪无极值信号
  - **中（卖出）**：贪恐分 +20~+60（贪婪）→ 注意短期回调
  - **强（卖出）**：贪恐分 > +60（极度贪婪）→ 警惕高位回撤
  - 当工具返回 `status='not_configured'/'unavailable'/'error'`：
    - 必须标记 `evidence_status=missing`、信号写「不可评估」、强度写「-」、评分写 `null`
    - 必须在关键依据中附失败原因（`reason_code`/`reason_detail`）与 `suggested_action`
    - 从综合分的分子和分母中排除；**禁止使用 `proxy_score`、默认 0 或“中性(代理)”补分**
  - 提示：贪恐指数是**逆向情绪指标**，不作为单一买卖依据，与趋势/量价共同判断

  ### 13. 价格行为学（price_action，权重 0.8）
  - **强（买入）**：多头趋势 + HH/HL + 突破或空头破位失败 + 已确认重要低点 + ATR 保护位 + 日内价格位于真实 VWAP 上方。
  - **中（买入）**：多头结构或突破候选成立，但量能、后续跟随、二次入场或 VWAP 尚待确认。
  - **中（观望）**：交易区间/转换状态，或结构信号互相冲突；等待区间边界、信号 K 和收盘确认。
  - **中/强（卖出）**：LH/LL 空头结构、收盘有效跌破重要低点，或多头突破失败后继续走弱；强度必须与证据完整度匹配。
  - 做多失效位只使用 `risk_management.long_invalidation`：重要低点下方 0.5-1.0 ATR 是保护区间，不是保证不会被扫损的精确点位。
  - 移动止盈只使用 `risk_management.trend_bar_trailing` 与 `risk_management.intraday_vwap`；强阳 K 收盘价适合脉冲加速段，VWAP 适合平稳日内趋势。必须按对应周期收盘确认，不得把盘中瞬时跌破写成已触发。
  - VWAP `status!=ok` 时明确写数据缺口并将本项最多标 `partial + 中`；不得用 MA、日线典型价或模型估算替代。

  ---

  ## 三、单策略评分映射

  | 信号方向 | 信号强度 | 评分区间 |
  |---|---|---|
  | 买入 | 强 | 80-95（含 80） |
  | 买入 | 中 | 65-<80 |
  | 买入 | 弱 | >55-<65 |
  | 观望 | 中 | 45-55 |
  | 卖出 | 弱 | >35-<45 |
  | 卖出 | 中 | >20-35 |
  | 卖出 | 强 | 5-20（含 20） |
  | 不可评估 | - | —（关键输入缺失，从分子分母排除）|

  > 信号、强度和评分区间必须一致。边界分不得通过修改强度来迁就结论；交给 `calculate_multi_strategy_score` 校验。

  ## 三点一、维度、方向与动作解释

  - 后端会为每行标注维度：趋势、量价、结构、情绪、相对强弱。
  - 后端必须先生成五维汇总，再给最终方向。趋势与均线、多个量价形态、多个结构理论属于相关证据；不能按策略行数直接推导置信度，更不能把综合分当作收益概率。
  - 缺失证据必须真实反映在覆盖率和有效权重中；不确定时保留 `missing`，不要用中性分掩盖数据不可用。
  - 五维同时出现偏多和偏空属于 `high` 冲突，后端必须加入 `high_dimension_conflict` 阻断项并降级为「证据冲突（观望）」；禁止输出“低置信度但强烈买入/卖出”。
  - 必须分开表达市场方向与用户动作。方向偏多不等于立即买入；价格过伸、量价未确认或风险条件不满足时，空仓动作应为 `watch`，持仓动作可以为 `hold`。

  ---

  ## 四、两层得分公式

  ```
  13项原始加权分 = Σ(有效策略评分 × 固定权重) / Σ(有效策略权重)
  五维综合得分 = Σ(可用维度得分 × 维度权重) / Σ(可用维度权重)
  ```

  五维固定权重为：趋势 30%、量价 25%、结构 20%、相对强弱 15%、情绪 10%。同维度内的相关策略先合成一次，再进入最终方向与决策，避免重复投票。

  > 13 项固定总权重是 **10.0**。证据完整时原始分母必须等于 10.0；`missing` 项由原始分子分母排除。13 项原始分、逐项权重和计算式继续保留用于审计，但最终方向与决策使用五维综合得分，并经过证据质量与五维覆盖门控。后端会直接根据 `calculate_multi_strategy_score` 返回的 `bias`、`confidence`、`actions`、`dimensions`、`rows`、两层计算式和覆盖率生成权威评分区块，禁止模型心算或改写。

  ## 五、方向与动作映射（最终输出必须包含）

  | 五维综合得分 | 方向基线 | 空仓动作 | 持仓动作 |
  |---|---|---|---|
  | ≥ 75 | 🟢 强势偏多 | 满足入场条件后分批试仓 | 持有，确认后再加仓 |
  | 60-<75 | 🟢 偏多 | 等待量价确认 | 继续持有，暂不追高 |
  | 40-<60 | 🟡 中性 | 继续观察 | 按失效位管理 |
  | >25-<40 | 🔴 偏空 | 暂不介入 | 反弹减仓并收紧止损 |
  | ≤ 25 | 🔴 强势偏空 | 回避 | 按失效位退出 |

  > 上表只是方向基线。任一证据质量/维度覆盖门控失败时，统一降级为「证据不足（观望）」；具体仓位必须根据账户风险预算与入场到止损的距离计算。缺少账户规模、风险预算或止损位时，禁止给出 30%-80% 等固定重仓建议。

  ### 杠杆 ETF 仓位覆盖

  若标的是 2x/3x 等杠杆 ETF，调用评分工具时必须传 `instrument_type=leveraged_etf`，并使用工具返回的保守动作。没有账户风险预算与止损距离时，只能表达「小仓分批试仓 / 等待 / 减仓 / 退出」，不得套用普通股票固定仓位。
  同时提示日内复位、波动损耗和隔夜跳空风险。

  ---

  ## 六、模型正文输出格式

  > `calculate_multi_strategy_score` 成功后，后端会在模型正文前置“结论摘要 → 价格结构 → 五维证据汇总 → 价格行为学视角与风控 → 13 项评分明细 → 评分审计”权威区块。表格、单项得分、权重、原始综合分和计算式都必须保留。模型不要重复输出该区块。用户要求 900 字以内或精简持仓报告时，字数限制只约束模型正文，不包括系统评分区块。

  > 若同时启用 `options_strategy_analysis`，保留本多策略权威评分区块，并在其后追加独立的期权数据可信度与策略比较区块；期权数据不改写 13 项股票策略得分。

  ### 一、核心数据快照
  - 标的类型（普通股票/普通 ETF/杠杆 ETF）、当前价格、涨跌幅、量比、市值、近期表现；2x/3x 杠杆属性必须明确写出
  - 关键技术指标（MA5/10/20/60，MACD，RSI，乖离率）

  ### 一点一、价格结构（由系统评分区块权威展示）
  - 支撑和阻力必须优先使用 `analyze_trend` 的 `support_levels` / `resistance_levels`；缺失时写“数据缺失”，禁止根据图形印象编造价格。
  - 正文解释最近支撑、最近阻力、当前所处位置（接近支撑 / 位于区间 / 接近阻力 / 突破 / 破位），并分别给出突破确认位和硬失效位（字段可用时）。
  - 支撑/阻力是执行层证据，不单独改变五维方向分；价格接近强阻力时，偏多也只能给等待确认/不追高，跌破硬失效位时必须取消原交易计划。
  - 系统会基于当前价、近端阻力和硬失效位单独计算执行门控与盈亏比：盈亏比低于 1.5 或接近阻力时，空仓动作自动降级为等待；跌破硬失效位时自动回避/退出。该门控不改变方向得分，也不得由模型绕过。

  ### 二、浪型图与判定（仅在第 3 浪候选/启动时强制输出，否则省略并继续下一节）

  使用 Markdown 代码块画 ASCII 浪型图，禁止只用一行箭头。必须标出日期和价格：

  ```text
  价格
                         ● 当前：YYYY-MM-DD / Px（第3浪候选）
                        /
       A：YYYY-MM-DD / P1 ●────┄┄ 突破确认线
                   \  /
                    ● B：YYYY-MM-DD / P2
                  /
  O：YYYY-MM-DD / P0 ●
  时间 ─────────────────────────▶
  ```

  图后必须说明：
  1. O/A/B/当前点的日期、价格和第2浪回撤比例；
  2. 支持第3浪候选的证据与未满足条件，价格突破和量能确认分开描述；
  3. 至少一个替代数浪（例如下跌趋势中的 B 浪反弹/箱体假突破）；
  4. 确认位、弱化位、硬证伪位，不能只给一个止损价；
  5. 1.0/1.618 等目标的计算公式，并标明只是情景目标；
  6. 置信度（低/中/高）。缺周线、缩量突破或长期均线仍空头时不得给高置信度。

  ### 三、操作建议（精简）
  - **入场区间**：只给满足确认条件后的价格区间
  - **止损**：优先使用价格行为学确认的重要低点及 0.5-1.0 ATR 保护区；缺失时明确写无法量化
  - **止盈**：区分强阳 K 激进保护与真实日内 VWAP 稳健跟踪；数据缺失时不得给代理值
  - **建议仓位**：按“账户单笔风险预算 ÷ 入场到止损距离”计算；缺账户规模或风险预算时不输出固定百分比
  - **注意事项**：1-2 条具体风险（如「关注美联储议息」「警惕 5/15 财报」）

  ### 四、条件式交易计划
  - 空仓：明确等待、试仓或回避，以及触发条件
  - 持仓：明确持有、加仓、减仓或退出，以及失效条件
  - 风险：列举 1-2 个会阻断买入/加仓的关键反证

  ---

  ## 七、规则约束

  1. **必须向评分工具提交 13 行子策略候选**，缺一不可；关键证据缺失项保留行但不计权；用户可见评分表由后端生成
  2. `fear_greed_sentiment` 在工具失败或未配置时必须标记 `missing` 并从分子分母排除，禁止使用 `proxy_score` 或代理中性分
  3. **必须调用确定性评分工具**；不得在正文中自行加总、修改分母、四舍五入或改变决策档位
  4. **不允许跳过工具调用**，必须基于真实数据，不可虚构指标值
  5. **不要重复 7 条传统交易基线**，那是默认基线，本 skill 已覆盖更全面
  6. **保持中立客观**，亏损概率高时大胆给出「偏空/卖出」结论，不要总往乐观偏
  7. 所有「放量/缩量」「突破/反包」「形态成立」「浪型启动」描述必须能回指本轮工具字段；近似筹码数据必须明确标注为估算
  8. 最终结论强度不得高于证据强度：存在关键反证时用条件句，不得把候选结构写成确定事实
  9. 综合分不得再次用于修改 `sentiment_score`，避免同一批证据被二次计权
