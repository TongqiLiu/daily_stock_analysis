instructions: |
  **多策略联合分析（Multi-Strategy Consensus）**

  你的任务是调用以下 11 个内置策略框架对该股票逐项评估，并输出**严格结构化**的表格与综合评分。

  ---

  ## 一、工具调用顺序（必须执行）

  按顺序调用，结果保留在上下文用于后续打分：

  1. `get_realtime_quote` — 当前价格、涨跌幅
  2. `get_daily_history` — 近 120 日 K 线
  3. `analyze_trend` — MA5/MA10/MA20、MACD、RSI、KDJ、布林带
  4. `calculate_ma` — 均线扩展（含 MA60/MA120/MA250 和乖离）
  5. `get_volume_analysis` — 量比、放量/缩量、近 30 日量价
  6. `get_fear_greed_index` — szdt.tech 贪恐分（-100~100），用于第 12 项情绪打分

  补充工具按需调用：`analyze_pattern`（形态识别）、`get_chip_distribution`（筹码）、`get_capital_flow`（主力资金）。

  ---

  ## 二、12 个子策略评估口诀（精简规则）

  ### 1. 多头趋势（bull_trend，权重 1.0）
  - **强**：MA5 > MA10 > MA20 排列 + MA20 斜率向上 + 乖离率 < 5%
  - **中**：MA5 > MA10，MA20 走平
  - **弱**：均线粘合 / 价格跌破 MA20

  ### 2. 缠论（chan_theory，权重 1.0）
  - **强**：底背驰 + MACD 绿柱缩小（一买）
  - **中**：二买/三买信号、中枢突破
  - **弱**：中枢震荡无方向、顶背驰

  ### 3. 均线金叉（ma_golden_cross，权重 0.9）
  - **强**：MA5 上穿 MA10 + 量能放大；DIF 上穿 DEA（MACD 金叉）
  - **中**：MA5 上穿 MA10 但量能温和
  - **弱**：均线纠缠、死叉风险

  ### 4. 缩量回踩（shrink_pullback，权重 0.9）
  - **强**：回踩 MA5/MA10 不破 + 成交量萎缩 30% 以上
  - **中**：回踩 MA20 企稳
  - **弱**：跌破 MA20、放量下杀

  ### 5. 放量突破（volume_breakout，权重 0.8）
  - **强**：突破 20 日新高 + 量比 ≥ 1.5
  - **中**：突破短期阻力位 + 量能温和放大
  - **弱**：缩量假突破、量价背离

  ### 6. 波浪理论（wave_theory，权重 0.8）
  - **强**：第 2 浪回调（黄金坑）/ 第 3 浪初期突破
  - **中**：第 4 浪调整结束
  - **弱**：第 5 浪末端、C 浪进行中

  ### 7. 底部放量（bottom_volume，权重 0.7）
  - **强**：周线底部 + 日线放量 + 长下影
  - **中**：周线底部企稳，量能温和
  - **弱**：地量未现、阴跌不止

  ### 8. 箱体震荡（box_oscillation，权重 0.7）
  - **强**：箱体下沿企稳（低吸点）
  - **中**：箱体中部震荡
  - **弱**：箱体上沿（高位）/ 跌破箱体

  ### 9. 龙头策略（dragon_head，权重 0.7）
  - **强**：板块强势 + 个股领涨 + 创新高
  - **中**：板块温和 + 个股跟随
  - **弱**：板块走弱 / 个股跑输

  ### 10. 情绪周期（emotion_cycle，权重 0.6）
  - **强**：市场恐慌期 + 个股逆势抗跌（恐慌买入）
  - **中**：市场中性，情绪平稳
  - **弱**：市场极度贪婪期（高位风险）

  ### 11. 一阳夹三阴（one_yang_three_yin，权重 0.6）
  - **强**：标准形态 + 放量阳包阴
  - **中**：形态完整但量能一般
  - **弱**：形态破坏 / 阴线吞噬阳线

  ### 12. 贪恐情绪极值（fear_greed_sentiment，权重 0.5，逆向）
  - 数据来源：`get_fear_greed_index` 工具（szdt.tech，约 -100~100）
  - **强（买入）**：贪恐分 < -60（极度恐慌）→ 反向布局窗口
  - **中（买入）**：贪恐分 -60~-20（恐慌）→ 关注情绪修复
  - **中（观望）**：贪恐分 -20~+20（中性）→ 情绪无极值信号
  - **中（卖出）**：贪恐分 +20~+60（贪婪）→ 注意短期回调
  - **强（卖出）**：贪恐分 > +60（极度贪婪）→ 警惕高位回撤
  - **不适用**：工具返回 status='not_configured'/'unavailable' 时
  - 提示：贪恐指数是**逆向情绪指标**，不作为单一买卖依据，与趋势/量价共同判断

  ---

  ## 三、单策略评分映射

  | 信号方向 | 信号强度 | 评分区间 |
  |---|---|---|
  | 买入 | 强 | 80-95 |
  | 买入 | 中 | 65-80 |
  | 买入 | 弱 | 55-65 |
  | 观望 | 中 | 45-55 |
  | 卖出 | 弱 | 35-45 |
  | 卖出 | 中 | 20-35 |
  | 卖出 | 强 | 5-20 |
  | 不适用 | - | 50（中性，不计入加权）|

  > 「不适用」用于该策略对当前个股完全无关的情况（例如 `one_yang_three_yin` 找不到对应 K 线形态时），评分填 50 并在权重列写「-」。

  ---

  ## 四、综合得分公式

  ```
  综合得分 = Σ(策略评分 × 权重) / Σ(权重)
  ```

  > 「不适用」的策略不计入分子分母。

  ## 五、决策映射（最终输出必须包含）

  | 综合得分 | 决策 | 建议仓位 |
  |---|---|---|
  | ≥ 75 | 🟢 强烈买入 | 重仓 50-80% |
  | 60-75 | 🟢 偏多 | 中仓 30-50% |
  | 40-60 | 🟡 观望 | 轻仓 ≤ 20% |
  | 25-40 | 🔴 偏空 | 减仓至 ≤ 10% |
  | ≤ 25 | 🔴 卖出 | 清仓 |

  ---

  ## 六、输出格式（严格遵守，不要额外章节）

  ### 一、核心数据快照
  - 当前价格、涨跌幅、量比、市值、近期表现
  - 关键技术指标（MA5/10/20/60，MACD，RSI，乖离率）

  ### 二、子策略评估表（必须 12 行）

  ```markdown
  | # | 策略 | 信号 | 强度 | 评分 | 权重 | 关键依据 |
  |---|---|---|---|---|---|---|
  | 1 | 多头趋势 | 买入 | 强 | 88 | 1.0 | MA5(95.2) > MA10(92.1) > MA20(89.5)，斜率向上 |
  | 2 | 缠论 | 买入 | 中 | 72 | 1.0 | 二买信号已确立，未创新低 |
  | 3 | 均线金叉 | 观望 | 中 | 50 | 0.9 | MA5/MA10 已金叉但量能未跟上 |
  | ... | ... | ... | ... | ... | ... | ... |
  | 11 | 一阳夹三阴 | 不适用 | - | 50 | - | 当前 K 线无该形态 |
  | 12 | 贪恐情绪极值 | 卖出 | 强 | 18 | 0.5 | 贪恐分 84 → 极度贪婪，逆向警示高位回撤 |
  ```

  ### 三、加权综合得分

  - **加权综合得分：72.5 / 100** （记为粗体并显眼）
  - 计算过程：(88×1.0 + 72×1.0 + 50×0.9 + ...) / (1.0 + 1.0 + 0.9 + ...)
  - 决策映射：🟢 偏多

  ### 四、操作建议（精简）
  - **入场区间**：$XX – $XX
  - **止损**：$XX（MA20 下方 / 前低）
  - **止盈**：$XX（前高 / 1.618 浪展开目标）
  - **建议仓位**：30-50%
  - **注意事项**：1-2 条具体风险（如「关注美联储议息」「警惕 5/15 财报」）

  ### 五、策略一致性观察（≤ 80 字）
  - 主要看多策略：列举 2-3 个
  - 主要看空策略：列举 0-2 个（若有）
  - 一致性结论：高 / 中 / 低

  ---

  ## 七、规则约束

  1. **必须输出 12 行子策略评分**，缺一不可（无法评估时填 50 + 「不适用」）
  2. **必须显示加权综合得分计算过程**，便于用户复核
  3. **不允许跳过工具调用**，必须基于真实数据，不可虚构指标值
  4. **不要重复 7 条传统交易基线**，那是默认基线，本 skill 已覆盖更全面
  5. **保持中立客观**，亏损概率高时大胆给出「偏空/卖出」结论，不要总往乐观偏

  评分调整建议（影响 sentiment_score）：
  - 加权综合得分 ≥ 75：`sentiment_score +15`
  - 60-75：`sentiment_score +8`
  - 40-60：`sentiment_score 维持基准`
  - 25-40：`sentiment_score -8`
  - ≤ 25：`sentiment_score -15`
