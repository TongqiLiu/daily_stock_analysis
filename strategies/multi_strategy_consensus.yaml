# Multi-Strategy Consensus Skill / 多策略联合分析
# Meta-skill that orchestrates 11 built-in strategies into a single weighted-score
# table output. Designed for the chat page "⚡ 多策略联合" button.

name: multi_strategy_consensus
display_name: ⚡ 多策略联合
description: 一次性调用 11 个内置策略（趋势/均线/量价/缠论/波浪/情绪/形态等）对该股票逐项打分，输出统一表格与加权综合得分。
