# Multi-Strategy Consensus Skill / 多策略联合分析
# Meta-skill that orchestrates 12 built-in strategies into a single weighted-score
# table output. Designed for the chat page "⚡ 多策略联合" button.

name: multi_strategy_consensus
display_name: ⚡ 多策略联合
description: 一次性调用 12 个内置策略（趋势/均线/量价/缠论/波浪/情绪/形态等）对该股票逐项打分，输出统一表格与加权综合得分。
category: framework
core_rules: [1, 2, 3, 4, 5]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
  - calculate_ma
  - get_volume_analysis
  - get_fear_greed_index
  - analyze_pattern
  - calculate_multi_strategy_score
aliases: [多策略, 联合分析, 综合分析, 多策略联合]
default_priority: 5
user_invocable: true
default_active: false
default_router: false
market_regimes: []

instructions: |
  **多策略联合分析（Multi-Strategy Consensus）**

  你的任务是调用以下 12 个内置策略框架对该股票逐项评估，并输出**严格结构化**的表格与综合评分。

  ---

  ## 一、工具调用顺序（必须执行）

  按顺序调用，结果保留在上下文用于后续打分：

  1. `get_realtime_quote` — 当前价格、涨跌幅
  2. `get_daily_history` — 近 120 日 K 线
  3. `analyze_trend` — MA5/MA10/MA20、MACD、RSI、KDJ、布林带
  4. `calculate_ma` — 均线扩展（含 MA60/MA120/MA250 和乖离）
  5. `get_volume_analysis` — 量比、放量/缩量、近 30 日量价
  6. `get_fear_greed_index` — szdt.tech 贪恐分（-100~100），用于第 12 项情绪打分
  7. `analyze_pattern` — 形态识别；第 11 项只有工具或最近 4 根 OHLC 明确支持时才允许给方向分
  8. 先形成 12 项候选结果，再调用 `calculate_multi_strategy_score` — 必须根据名称/代码显式传 `instrument_type=standard|leveraged_etf`；由程序校验评分区间、证据覆盖率、有效权重、综合得分和仓位；工具返回 invalid 时必须修正 12 项并重新调用，禁止绕过

  补充工具按需调用：`get_chip_distribution`（筹码）、`get_capital_flow`（主力资金）。

  ### 证据分级（每项必填）

  - `complete`：该策略的必要条件均有本轮工具数据支持。
  - `partial`：只有部分必要条件；可以评分，但最高只能给「中」，并在依据中写清缺口。
  - `missing`：关键输入缺失；该行仍保留，但必须写「不可评估 / - / —」，交由评分工具从分母排除，禁止用 50 分伪装成中性证据。
  - 最终结论必须报告证据覆盖：完整/部分/缺失项数和有效权重覆盖率。覆盖率低于 70% 或可评估项少于 8 项时，只能输出「证据不足（观望）」。

  ---

  ## 二、12 个子策略评估口诀（精简规则）

  ### 1. 多头趋势（bull_trend，权重 1.0）
  - **强**：MA5 > MA10 > MA20 排列 + MA20 斜率向上 + 乖离率 < 5%
  - **中**：MA5 > MA10，MA20 走平
  - **弱**：均线粘合 / 价格跌破 MA20

  ### 2. 缠论（chan_theory，权重 1.0）
  - **强**：底背驰 + MACD 绿柱缩小（一买）
  - **中**：二买/三买信号、中枢突破
  - **弱**：中枢震荡无方向、顶背驰
  - 只有 MACD 而没有可定位的中枢/笔/背驰比较段时，证据只能标 `partial`，不得写「底背驰完整」「一买确认」

  ### 3. 均线金叉（ma_golden_cross，权重 0.9）
  - **强**：MA5 上穿 MA10 + 量能放大；DIF 上穿 DEA（MACD 金叉）
  - **中**：MA5 上穿 MA10 但量能温和
  - **弱**：均线纠缠、死叉风险

  ### 4. 缩量回踩（shrink_pullback，权重 0.9）
  - **强**：回踩 MA5/MA10 不破 + 成交量萎缩 30% 以上
  - **中**：回踩 MA20 企稳
  - **弱**：跌破 MA20、放量下杀

  ### 5. 放量突破（volume_breakout，权重 0.8）
  - **强**：突破 20 日新高 + 量比 ≥ 1.5
  - **中**：突破短期阻力位 + 量能温和放大
  - **弱**：缩量假突破、量价背离
  - 量比 < 1.0 时禁止使用「放量突破」「放量反包」；即使价格创新高，也只能描述为缩量突破候选

  ### 6. 波浪理论（wave_theory，权重 0.8）
  - **强**：第 2 浪回调（黄金坑）/ 第 3 浪初期突破
  - **中**：第 4 浪调整结束
  - **弱**：第 5 浪末端、C 浪进行中
  - 浪型是候选解释，不是唯一事实。必须列出关键摆动点的日期/价格，不得只凭 MACD 或一次突破完成数浪
  - 突破第 1 浪高点只是「第 3 浪候选启动」的重要条件，不是充分条件；量能不足、长周期仍为空头或存在 B 浪替代解释时，最多给 `partial + 中`
  - 第 3 浪尚未走完时，不得宣称「三条铁律全部满足」；第 3 浪非最短、第 1/4 浪不重叠只能列为后续验证项
  - 禁止使用「无争议确认」「教科书级确认」「彻底反转」等绝对措辞，统一使用「候选」「概率判断」「待确认」
  - 若判断为「第 3 浪候选启动/已启动」，最终报告必须输出本文件后述的「浪型图与判定」章节

  ### 7. 底部放量（bottom_volume，权重 0.7）
  - **强**：周线底部 + 日线放量 + 长下影
  - **中**：周线底部企稳，量能温和
  - **弱**：地量未现、阴跌不止
  - 没有周线数据时证据最多为 `partial`，不得给「强」

  ### 8. 箱体震荡（box_oscillation，权重 0.7）
  - **强**：箱体下沿企稳（低吸点）
  - **中**：箱体中部震荡
  - **弱**：箱体上沿（高位）/ 跌破箱体

  ### 9. 龙头策略（dragon_head，权重 0.7）
  - **强**：板块强势 + 个股领涨 + 创新高
  - **中**：板块温和 + 个股跟随
  - **弱**：板块走弱 / 个股跑输
  - 没有本轮板块/基准对比数据时必须标 `missing` 并排除计分；不得凭公司名称、ETF 名称或历史印象声称板块走强/走弱

  ### 10. 情绪周期（emotion_cycle，权重 0.6）
  - **强**：市场恐慌期 + 个股逆势抗跌（恐慌买入）
  - **中**：市场中性，情绪平稳
  - **弱**：市场极度贪婪期（高位风险）
  - 必须同时有市场情绪和个股相对强弱证据；只有个股贪恐分时标 `partial`，不得与第 12 项用同一句依据重复强化方向

  ### 11. 一阳夹三阴（one_yang_three_yin，权重 0.6）
  - **强**：标准形态 + 放量阳包阴
  - **中**：形态完整但量能一般
  - **弱**：形态破坏 / 阴线吞噬阳线
  - 「阳包一阴」不等于「一阳夹三阴」。只有 `analyze_pattern` 或最近 4 根 OHLC 能明确证明标准结构时才允许给方向分
  - 未触发标准形态时按**观望/中/50 分**计入；形态数据不可用时标 `missing`

  ### 12. 贪恐情绪极值（fear_greed_sentiment，权重 0.5，逆向）
  - 数据来源：`get_fear_greed_index` 工具（szdt.tech，约 -100~100）
  - **强（买入）**：贪恐分 < -60（极度恐慌）→ 反向布局窗口
  - **中（买入）**：贪恐分 -60~-20（恐慌）→ 关注情绪修复
  - **中（观望）**：贪恐分 -20~+20（中性）→ 情绪无极值信号
  - **中（卖出）**：贪恐分 +20~+60（贪婪）→ 注意短期回调
  - **强（卖出）**：贪恐分 > +60（极度贪婪）→ 警惕高位回撤
  - 当工具返回 `status='not_configured'/'unavailable'/'error'`：
    - 必须使用工具返回的 `proxy_score`（默认 0）作为贪恐替代分
    - 标签写「中性(代理)」，信号写「观望」，强度写「中」
    - **仍按权重 0.5 计入综合分**，禁止写「不适用」
    - 在关键依据中附失败原因（`reason_code`/`reason_detail`）与 `suggested_action`
  - 提示：贪恐指数是**逆向情绪指标**，不作为单一买卖依据，与趋势/量价共同判断

  ---

  ## 三、单策略评分映射

  | 信号方向 | 信号强度 | 评分区间 |
  |---|---|---|
  | 买入 | 强 | 80-95 |
  | 买入 | 中 | 65-80 |
  | 买入 | 弱 | 55-65 |
  | 观望 | 中 | 45-55 |
  | 卖出 | 弱 | 35-45 |
  | 卖出 | 中 | 20-35 |
  | 卖出 | 强 | 5-20 |
  | 不可评估 | - | —（关键输入缺失，从分子分母排除）|

  > 信号、强度和评分区间必须一致。边界分不得通过修改强度来迁就结论；交给 `calculate_multi_strategy_score` 校验。

  ---

  ## 四、综合得分公式

  ```
  综合得分 = Σ(有效策略评分 × 固定权重) / Σ(有效策略权重)
  ```

  > 12 项固定总权重是 **9.2**。证据完整时有效分母必须等于 9.2；`missing` 项由工具排除后分母才允许降低。最终报告只能复制 `calculate_multi_strategy_score` 返回的 `weighted_numerator`、`included_weight`、`weighted_score`、`decision`、`position_guidance` 和证据覆盖率，禁止模型心算或改写。

  ## 五、决策映射（最终输出必须包含）

  | 综合得分 | 决策 | 建议仓位 |
  |---|---|---|
  | ≥ 75 | 🟢 强烈买入 | 重仓 50-80% |
  | 60-75 | 🟢 偏多 | 中仓 30-50% |
  | 40-60 | 🟡 观望 | 轻仓 ≤ 20% |
  | 25-40 | 🔴 偏空 | 减仓至 ≤ 10% |
  | ≤ 25 | 🔴 卖出 | 清仓 |

  ### 杠杆 ETF 仓位覆盖

  若标的是 2x/3x 等杠杆 ETF，调用评分工具时必须传 `instrument_type=leveraged_etf`，并使用工具返回的保守仓位，不得套用普通股票的 30-80% 仓位：
  - 强烈买入：上限 20%，必须分批
  - 偏多：上限 10-15%
  - 观望：观察或不超过 5%
  - 偏空：减至不超过 5%
  - 卖出：清仓
  同时提示日内复位、波动损耗和隔夜跳空风险。

  ---

  ## 六、输出格式（严格遵守，不要额外章节）

  ### 一、核心数据快照
  - 标的类型（普通股票/普通 ETF/杠杆 ETF）、当前价格、涨跌幅、量比、市值、近期表现；2x/3x 杠杆属性必须明确写出
  - 关键技术指标（MA5/10/20/60，MACD，RSI，乖离率）

  ### 二、子策略评估表（必须 12 行）

  ```markdown
  | # | 策略 | 信号 | 强度 | 评分 | 权重 | 证据 | 关键依据 |
  |---|---|---|---|---|---|---|---|
  | 1 | 多头趋势 | 买入 | 强 | 88 | 1.0 | 完整 | MA5>MA10>MA20，斜率向上 |
  | 2 | 缠论 | 买入 | 中 | 72 | 1.0 | 部分 | 二买候选；缺少完整笔段 |
  | 3 | 均线金叉 | 观望 | 中 | 50 | 0.9 | 完整 | 已金叉但量能未跟上 |
  | ... | ... | ... | ... | ... | ... | ... | ... |
  | 11 | 一阳夹三阴 | 观望 | 中 | 50 | 0.6 | 完整 | 未触发标准形态 |
  | 12 | 贪恐情绪极值 | 卖出 | 强 | 18 | 0.5 | 完整 | 贪恐84，逆向警示回撤 |
  ```

  ### 三、加权综合得分

  - **加权综合得分：72.5 / 100** （必须逐字复制评分工具）
  - 计算过程：`weighted_numerator / included_weight = weighted_score`（必须逐字复制评分工具；全量分母应为 9.2）
  - 证据覆盖：完整 X / 部分 Y / 缺失 Z，有效权重覆盖 XX.X%
  - 决策映射与建议仓位：必须逐字复制评分工具

  ### 四、浪型图与判定（仅在第 3 浪候选/启动时强制输出，否则省略并继续下一节）

  使用 Markdown 代码块画 ASCII 浪型图，禁止只用一行箭头。必须标出日期和价格：

  ```text
  价格
                         ● 当前：YYYY-MM-DD / Px（第3浪候选）
                        /
       A：YYYY-MM-DD / P1 ●────┄┄ 突破确认线
                   \  /
                    ● B：YYYY-MM-DD / P2
                  /
  O：YYYY-MM-DD / P0 ●
  时间 ─────────────────────────▶
  ```

  图后必须说明：
  1. O/A/B/当前点的日期、价格和第2浪回撤比例；
  2. 支持第3浪候选的证据与未满足条件，价格突破和量能确认分开描述；
  3. 至少一个替代数浪（例如下跌趋势中的 B 浪反弹/箱体假突破）；
  4. 确认位、弱化位、硬证伪位，不能只给一个止损价；
  5. 1.0/1.618 等目标的计算公式，并标明只是情景目标；
  6. 置信度（低/中/高）。缺周线、缩量突破或长期均线仍空头时不得给高置信度。

  ### 五、操作建议（精简）
  - **入场区间**：$XX – $XX
  - **止损**：$XX（MA20 下方 / 前低）
  - **止盈**：$XX（前高 / 1.618 浪展开目标）
  - **建议仓位**：30-50%
  - **注意事项**：1-2 条具体风险（如「关注美联储议息」「警惕 5/15 财报」）

  ### 六、策略一致性观察（≤ 80 字）
  - 主要看多策略：列举 2-3 个
  - 主要看空策略：列举 0-2 个（若有）
  - 一致性结论：高 / 中 / 低

  ---

  ## 七、规则约束

  1. **必须输出 12 行子策略评分**，缺一不可；关键证据缺失项保留行但不计权
  2. `fear_greed_sentiment` 在工具失败时必须使用 `proxy_score` 计分，禁止标记「不适用」
  3. **必须调用确定性评分工具并原样复制结果**；不得自行加总、修改分母、四舍五入或改变决策档位
  4. **不允许跳过工具调用**，必须基于真实数据，不可虚构指标值
  5. **不要重复 7 条传统交易基线**，那是默认基线，本 skill 已覆盖更全面
  6. **保持中立客观**，亏损概率高时大胆给出「偏空/卖出」结论，不要总往乐观偏
  7. 所有「放量/缩量」「突破/反包」「形态成立」「浪型启动」描述必须能回指本轮工具字段；近似筹码数据必须明确标注为估算
  8. 最终结论强度不得高于证据强度：存在关键反证时用条件句，不得把候选结构写成确定事实

  评分调整建议（影响 sentiment_score）：
  - 加权综合得分 ≥ 75：`sentiment_score +15`
  - 60-75：`sentiment_score +8`
  - 40-60：`sentiment_score 维持基准`
  - 25-40：`sentiment_score -8`
  - ≤ 25：`sentiment_score -15`
